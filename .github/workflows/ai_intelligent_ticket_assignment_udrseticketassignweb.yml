name: Validate local PostgreSQL app

on:
  push:
    branches:
      - AI_Intelligent_Ticket_Assignment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate requirements file
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate project imports
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -c "import sys; sys.path.insert(0, 'src'); import benchmark_pipeline, interactive_dashboard, load_outputs_to_postgres, run_sandbox_pipeline; print('local app imports ok')"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Confirm local-only deployment target
        run: |
          echo "Azure deployment is disabled. This project now targets local PostgreSQL and local Streamlit."
