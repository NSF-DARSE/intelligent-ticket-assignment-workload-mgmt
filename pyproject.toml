[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-ticket-assignment-workload-management"
version = "1.0.0"
description = "Autotask-based technician recommendation and workload management system."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Teja Sanagala" },
  { name = "Nikitha Katta" }
]
dependencies = [
  "pandas==2.3.3",
  "sqlalchemy==2.0.48",
  "psycopg2-binary==2.9.11",
  "python-dotenv==1.2.2",
  "numpy==2.4.3",
  "requests==2.32.5",
  "streamlit==1.55.0",
  "plotly==6.6.0",
  "sentence-transformers==5.4.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "assignment_scorer",
  "autotask_api_client",
  "benchmark_pipeline",
  "clean_employee_skills",
  "clean_ticket_data",
  "complexity_scoring",
  "db_connection",
  "evaluate_full_recommendation_model",
  "evaluate_similarity_model",
  "export_raw_data",
  "feature_engineering",
  "fetch_sandbox_tickets",
  "interactive_dashboard",
  "load_outputs_to_postgres",
  "nlp_ticket_similarity",
  "run_sandbox_pipeline",
]
